<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173d33">
  <meta name="description" content="Shop and follow Boreal Layer Co.">
  <title>Boreal Layer Co. | Shop & Socials</title>

  <style>
    :root {
      --forest: #173d33;
      --forest-2: #24594a;
      --cream: #f5f0e4;
      --paper: #fffdf8;
      --tan: #cdbf9d;
      --muted: #6e746d;
      --line: rgba(23, 61, 51, 0.16);
      --shadow: 0 24px 70px rgba(5, 25, 20, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--forest);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--forest);
      background:
        radial-gradient(circle at 15% 0%, rgba(205, 191, 157, 0.35), transparent 35%),
        radial-gradient(circle at 100% 100%, rgba(36, 89, 74, 0.5), transparent 42%),
        linear-gradient(145deg, #102e27, #173d33);
    }

    .hub {
      width: min(100%, 470px);
      padding: 30px 22px 24px;
      overflow: hidden;
      position: relative;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 28px;
      background:
        linear-gradient(rgba(245, 240, 228, 0.97), rgba(245, 240, 228, 0.99)),
        repeating-radial-gradient(circle at 25% 15%, transparent 0 26px, rgba(23, 61, 51, 0.025) 27px 28px);
      box-shadow: var(--shadow);
    }

    .hub::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: linear-gradient(90deg, var(--forest), var(--tan), var(--forest));
    }

    .brand-logo {
      width: min(260px, 78%);
      display: block;
      margin: 0 auto 12px;
      filter: drop-shadow(0 8px 13px rgba(23, 61, 51, 0.09));
    }

    .tagline {
      max-width: 340px;
      margin: 8px auto 23px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .divider {
      width: 74px;
      height: 2px;
      margin: 0 auto 21px;
      border-radius: 999px;
      background: var(--tan);
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .profile-link {
      min-height: 72px;
      display: grid;
      grid-template-columns: 52px 1fr 30px;
      gap: 13px;
      align-items: center;
      padding: 10px 14px 10px 10px;
      color: var(--forest);
      text-align: left;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--paper);
      box-shadow: 0 8px 18px rgba(23, 61, 51, 0.055);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .profile-link:hover,
    .profile-link:focus-visible {
      transform: translateY(-2px);
      border-color: var(--forest-2);
      box-shadow: 0 13px 26px rgba(23, 61, 51, 0.12);
      outline: none;
    }

    .profile-link.featured {
      border-color: rgba(23, 61, 51, 0.35);
      background: linear-gradient(135deg, #fffdf8, #f1ead9);
    }

    .icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: var(--cream);
      background: var(--forest);
    }

    .icon svg {
      width: 25px;
      height: 25px;
    }

    .profile-name {
      display: block;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .profile-handle {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .arrow {
      font-size: 25px;
      color: var(--forest-2);
    }

    footer {
      max-width: 340px;
      margin: 23px auto 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    footer strong {
      color: var(--forest);
    }

    @media (max-width: 420px) {
      body {
        padding: 12px;
      }

      .hub {
        padding: 27px 15px 21px;
        border-radius: 23px;
      }

      .brand-logo {
        width: min(245px, 82%);
      }

      .profile-link {
        grid-template-columns: 48px 1fr 26px;
        gap: 10px;
      }

      .icon {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>

<body>
  <main class="hub">
    <!-- Exact Boreal Layer Co. logo supplied by the owner. -->
    <img
      class="brand-logo"
      src="boreal-layer-co-logo.svg"
      alt="Boreal Layer Co. logo"
    >

    <p class="tagline">Shop our 3D printed creations and follow Boreal Layer Co. online.</p>
    <div class="divider" aria-hidden="true"></div>

    <nav class="links" aria-label="Boreal Layer Co. shop and social media profiles">
      <a class="profile-link featured" href="https://boreallayerco.etsy.com" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.2 3h12.1l.4 4.4h-1.2c-.7-2.4-1.6-2.9-4.2-2.9H10v6.3h2.7c1.9 0 2.3-.5 2.7-2.3h1.1v6.1h-1.1c-.4-1.8-.8-2.3-2.7-2.3H10v6.9h3.6c2.9 0 3.9-.7 4.8-3.5h1.2L19 21H5v-1.1c1.8-.3 2-.5 2-2.1V6.2c0-1.6-.2-1.8-1.8-2.1V3Z"/>
          </svg>
        </span>
        <span>
          <strong class="profile-name">Etsy Shop</strong>
          <small class="profile-handle">Shop Boreal Layer Co.</small>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="profile-link" href="https://www.instagram.com/boreallayerco" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span>
          <strong class="profile-name">Instagram</strong>
          <small class="profile-handle">@boreallayerco</small>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="profile-link" href="https://www.tiktok.com/@boreallayerco" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.7 3c.3 2.1 1.6 3.5 3.7 3.7v3.1c-1.4 0-2.7-.4-3.7-1.1v6.1a5.8 5.8 0 1 1-5-5.7v3.2a2.7 2.7 0 1 0 1.8 2.5V3h3.2Z"/>
          </svg>
        </span>
        <span>
          <strong class="profile-name">TikTok</strong>
          <small class="profile-handle">@boreallayerco</small>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="profile-link" href="https://www.facebook.com/share/1Dz1bn7dQi/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M13.7 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5H17V3.6c-.8-.1-1.6-.2-2.4-.2-2.4 0-4.1 1.5-4.1 4.2v2.3H7.8V13h2.7v8h3.2Z"/>
          </svg>
        </span>
        <span>
          <strong class="profile-name">Facebook</strong>
          <small class="profile-handle">Boreal Layer Co.</small>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </nav>

    <footer>
      <strong>Thanks for supporting my small Canadian business.</strong>
    </footer>
  </main>
</body>
</html>
